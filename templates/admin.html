<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administración | Amamora</title><link rel="stylesheet" href="/static/css/style.css"></head><body><header class="nav"><a href="/" class="brand"><img src="/static/images/branding/logo_a.png"><span>AMAMORA</span></a><nav><a href="/perfil">Mi cuenta</a><form method="post" action="/salir" class="inline-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button>Salir</button></form></nav></header><main class="dashboard"><span class="eyebrow">PANEL DE GESTIÓN</span><h1>Administración</h1><section><h2>Pedidos</h2><div class="table-wrap"><table><tr><th>Pedido</th><th>Cliente</th><th>Región</th><th>Total</th><th>Estado</th></tr>{% for p in orders %}<tr><td>{{ p['id'] }}</td><td>{{ p['nombre'] }}<br><small>{{ p['correo'] }}</small></td><td>{{ p['region'] }}</td><td>{{ p['total'] }} CLP</td><td><form method="post" action="/admin/pedido/{{ p['id'] }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><select name="estado">{% for e in ['solicitado','confirmado','fabricando','enviado','entregado','cancelado'] %}<option {{ 'selected' if p['estado']==e }}>{{ e }}</option>{% endfor %}</select><button>Guardar</button></form></td></tr>{% endfor %}</table></div></section><section><h2>Inventario</h2><div class="stock-grid">{% for i in stock %}<form method="post" action="/admin/stock/{{ i['id'] }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><span>{{ i['tipo'] }}</span><b>{{ i['nombre'] }}</b><input type="number" name="stock" min="0" max="100000" value="{{ i['stock'] }}"><button>Actualizar</button></form>{% endfor %}</div></section></main></body></html>
