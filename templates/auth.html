<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ 'Crear cuenta' if modo=='registro' else 'Ingresar' }} | Amamora</title><link rel="stylesheet" href="/static/css/style.css"></head><body><header class="nav"><a href="/" class="brand"><img src="/static/images/branding/logo_a.png"><span>AMAMORA</span></a></header><main class="auth-shell"><form method="post" class="auth-card"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><span class="eyebrow">MI AMAMORA</span><h1>{{ 'Crea tu cuenta' if modo=='registro' else 'Bienvenida' }}</h1>{% if error %}<p class="form-error">{{ error }}</p>{% endif %}{% if modo=='registro' %}<label>Nombre<input name="nombre" required minlength="2" maxlength="80" autocomplete="name"></label>{% endif %}<label>Correo<input type="email" name="email" required maxlength="254" autocomplete="email"></label><label>Contraseña<input type="password" name="password" required minlength="10" maxlength="200" autocomplete="{{ 'new-password' if modo=='registro' else 'current-password' }}"></label><button class="btn">{{ 'Registrarme' if modo=='registro' else 'Ingresar' }}</button><p>{% if modo=='registro' %}¿Ya tienes cuenta? <a href="/acceso">Ingresa</a>{% else %}¿Eres nueva? <a href="/registro">Crea una cuenta</a>{% endif %}</p></form></main></body></html>
