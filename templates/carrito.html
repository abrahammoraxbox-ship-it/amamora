<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tu carrito | Amamora</title><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"></head><body><header class="nav"><a href="/" class="brand"><img src="{{ url_for('static',filename='images/branding/logo_a.png') }}" alt="Amamora"><span>AMAMORA</span></a><nav><a href="/disenador">Seguir diseñando</a></nav></header>
<main class="checkout-shell"><section><span class="eyebrow">TU SELECCIÓN</span><h1>Carrito de compra</h1><div id="cart-items" class="cart-items"></div></section><aside class="checkout-card"><h2>Resumen</h2><div class="total-line"><span>Subtotal</span><b id="subtotal">$0</b></div><div class="total-line"><span>Envío en Chile</span><b>Por calcular</b></div><div class="total-line grand"><span>Total</span><b id="total">$0</b></div><form id="order-form"><label>Nombre<input required name="nombre"></label><label>Correo<input required type="email" name="correo"></label><label>Región<select required name="region"><option value="">Selecciona tu región</option><option>Arica y Parinacota</option><option>Tarapacá</option><option>Antofagasta</option><option>Atacama</option><option>Coquimbo</option><option>Valparaíso</option><option>Metropolitana</option><option>O’Higgins</option><option>Maule</option><option>Ñuble</option><option>Biobío</option><option>La Araucanía</option><option>Los Ríos</option><option>Los Lagos</option><option>Aysén</option><option>Magallanes</option></select></label><button class="btn" type="submit">Solicitar mi pedido</button></form><p class="checkout-note">Confirmaremos fabricación, despacho y medio de pago antes de comenzar.</p></aside></main>
<div id="order-modal" class="modal" hidden><div><span>♡</span><h2>¡Solicitud recibida!</h2><p>Tu pedido <strong id="order-number"></strong> quedó guardado. Te contactaremos para confirmar los detalles.</p><button class="btn" id="close-modal">Aceptar</button></div></div><script src="{{ url_for('static',filename='js/store.js') }}"></script><script src="{{ url_for('static',filename='js/cart.js') }}"></script></body></html>
