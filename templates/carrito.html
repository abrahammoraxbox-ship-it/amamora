<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="{{ csrf_token() }}"><title>Tu carrito | Amamora</title><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"></head><body><header class="nav"><a href="/" class="brand"><img src="{{ url_for('static',filename='images/branding/logo_a.png') }}" alt="Amamora"><span>AMAMORA</span></a><nav><a href="/disenador">Seguir diseñando</a></nav></header>
<main class="checkout-shell"><section><span class="eyebrow">TU SELECCIÓN</span><h1>Carrito de compra</h1><div id="cart-items" class="cart-items"></div></section><aside class="checkout-card"><h2>Resumen</h2><div class="total-line"><span>Subtotal</span><b id="subtotal">$0</b></div><div class="total-line"><span>Envío en Chile</span><b id="shipping">Por calcular</b></div><div class="total-line grand"><span>Total</span><b id="total">$0</b></div><form id="order-form"><label>Nombre<input required name="nombre" minlength="2" maxlength="80" autocomplete="name"></label><label>Correo<input required type="email" name="correo" maxlength="254" autocomplete="email"></label><label>Región<select required name="region" id="region"><option value="">Selecciona tu región</option>{% for region,price in regiones.items() %}<option value="{{ region }}" data-shipping="{{ price }}">{{ region }}</option>{% endfor %}</select></label><label>Dirección<input required name="direccion" minlength="5" maxlength="200" autocomplete="street-address"></label><label>Medio de pago<select name="payment"><option>Mercado Pago (próximamente)</option><option>Transbank Webpay (próximamente)</option><option>Transferencia bancaria</option></select></label><button class="btn" type="submit">Solicitar mi pedido</button></form><p class="checkout-note">Confirmaremos fabricación, despacho y pago antes de comenzar.</p></aside></main>
<div id="order-modal" class="modal" hidden><div><span>♡</span><h2>¡Solicitud recibida!</h2><p>Tu pedido <strong id="order-number"></strong> quedó guardado. Te contactaremos para confirmar los detalles.</p><button class="btn" id="close-modal">Aceptar</button></div></div><script src="{{ url_for('static',filename='js/store.js') }}"></script><script src="{{ url_for('static',filename='js/cart.js') }}"></script></body></html>
