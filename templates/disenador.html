<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Estudio 3D | Amamora</title><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"></head><body>
<header class="nav"><a href="/" class="brand"><img src="{{ url_for('static',filename='images/branding/logo_a.png') }}" alt="Amamora"><span>AMAMORA</span></a><nav><a href="/categorias">Cambiar joya</a><a class="cart-link" href="/carrito">Carrito <b data-cart-count>0</b></a></nav></header>
<main class="designer-shell"><section class="viewer-panel"><div class="viewer-top"><span class="live-dot">● VISTA 3D EN TIEMPO REAL</span><button id="reset-view" class="icon-btn">↻</button></div><div id="jewel-viewer"><div class="loading">Preparando tu joya…</div></div><p class="viewer-help">Arrastra para girar · Rueda para acercar</p></section>
<section class="controls-panel"><span class="eyebrow">ESTUDIO AMAMORA</span><h1>Diseña tu <span id="product-title">anillo</span></h1><p class="intro">Cada cambio se refleja al instante en el modelo.</p>
<div class="config-group"><label for="categoria">Tipo de joya</label><select id="categoria"><option>Anillo</option><option>Pulsera</option><option>Collar</option><option>Aretes</option></select></div>
<div class="config-group"><label>Alambrismo</label><div class="choice-row" data-option="wire"><button class="choice active" data-value="Clásico">Clásico</button><button class="choice" data-value="Espiral">Espiral</button><button class="choice" data-value="Trenzado">Trenzado</button></div></div>
<div class="config-group"><label>Metal</label><div class="swatches" data-option="metal"><button class="swatch active" data-value="Oro" data-color="#d8ad55" style="--swatch:#d8ad55"></button><button class="swatch" data-value="Plata" data-color="#cfd4d7" style="--swatch:#cfd4d7"></button><button class="swatch" data-value="Cobre" data-color="#b96f4a" style="--swatch:#b96f4a"></button><span id="metal-name">Oro</span></div></div>
<div class="config-group"><label>Piedra natural</label><div class="stone-grid" data-option="stone"><button class="stone active" data-value="Amatista" data-color="#8d56b2"><i style="--stone:#8d56b2"></i>Amatista</button><button class="stone" data-value="Cuarzo rosa" data-color="#efa9b7"><i style="--stone:#efa9b7"></i>Cuarzo rosa</button><button class="stone" data-value="Esmeralda" data-color="#218b68"><i style="--stone:#218b68"></i>Esmeralda</button><button class="stone" data-value="Lapislázuli" data-color="#2253a3"><i style="--stone:#2253a3"></i>Lapislázuli</button></div></div>
<div class="config-group"><label>Forma de la piedra</label><div class="choice-row" data-option="shape"><button class="choice active" data-value="Redonda">Redonda</button><button class="choice" data-value="Corazón">Corazón</button><button class="choice" data-value="Diamante">Diamante</button></div></div>
<div class="config-group range-line"><label for="size">Tamaño <b><span id="size-value">10</span> mm</b></label><input id="size" type="range" min="7" max="14" value="10"></div>
<div class="summary"><div><small>Tu diseño desde</small><strong id="price">$39.990</strong><small>CLP · IVA incluido</small></div><button id="add-cart" class="btn">Agregar al carrito</button></div><p id="cart-message" class="cart-message"></p></section></main>
<script>window.AMAMORA_INITIAL_CATEGORY={{ categoria_inicial|default(none)|tojson }};</script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script><script src="{{ url_for('static',filename='js/store.js') }}"></script><script src="{{ url_for('static',filename='js/configurator.js') }}"></script></body></html>
